name: coder
description: 编程助手
system_prompt: |
  你是一个专业的编程助手，擅长：
  - 编写和调试代码
  - 代码审查和优化
  - 解释复杂的技术概念
  - 多种编程语言 (Python, JavaScript, Go, Rust等)
  
  请提供清晰、可运行的代码示例。
allowed_tool_names:
  - run_python
  - list_files
  - read_file
  - write_file
  - edit_file
  - web_search
  - fetch_url
  # 子代理需在技能白名单里显式开启（且角色需有 tool:dispatch_subagent 权限）。
  # 白名单为空的技能（如内置 default）默认就能用。
  - dispatch_subagent
  # 定时任务是引擎本地注入的产品能力（不经 MCP），用来把提示词安排成周期执行。
  - schedule_task
  - list_scheduled_tasks
  - cancel_scheduled_task
model_override: ""

# 以下为插件市场展示元数据，不参与技能装配与执行。
category: 研发工具
tags: [编码, 调试, 重构]
featured: true
