services:
  # ===== futureAgent API 服务 =====
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: futureagent-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DSN: postgresql://postgres:password@postgres:5432/postgres
      DATABASE_URL: postgresql+psycopg://postgres:password@postgres:5432/postgres
      MCP_SERVERS_JSON: '{"local_tools":"http://mcp:8050/mcp"}'
      MCP_SERVER_PORT: 8050
      # The bundled MCP server verifies a signed workspace claim and roots
      # every file operation in that tenant's private directory.  This safe
      # Compose path can therefore expose its five file tools by default.
      ENABLE_LOCAL_MCP_TOOLS: ${ENABLE_LOCAL_MCP_TOOLS:-true}
      MCP_WORKSPACE_SIGNING_KEY: ${MCP_WORKSPACE_SIGNING_KEY:-change-this-development-mcp-secret-before-production}
      # 默认直连已配置的供应商；不启动独立 LiteLLM 代理服务。
      LITELLM_PROXY_URL: ""
      # 默认 Compose 仅用于本地 HTTP 开发。生产环境必须经由 HTTPS 入口，
      # 并显式设置 ENVIRONMENT=production，确保续期 Cookie 只经 HTTPS 传输。
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RUN_MIGRATIONS_ON_STARTUP: "true"
      SKILLS_DIR: /app/runtime/config/skills
      CASBIN_POLICY_PATH: /app/runtime/config/auth/rbac_policy.csv
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      STORAGE_S3_PREFIX: ${STORAGE_S3_PREFIX:-futureagent}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_started
    volumes:
      - futureagent_uploads:/app/uploads
      - futureagent_runtime_config:/app/runtime/config
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - futureagent-net
    restart: unless-stopped

  # ===== 本地 MCP 工具服务 =====
  mcp:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: futureagent-mcp
    ports:
      - "127.0.0.1:8050:8050"
    environment:
      MCP_WORKSPACE_ROOT: /workspace
      MCP_SERVER_PORT: 8050
      MCP_WORKSPACE_SIGNING_KEY: ${MCP_WORKSPACE_SIGNING_KEY:-change-this-development-mcp-secret-before-production}
      MCP_ALLOWED_HOSTS_CSV: mcp:8050,localhost:8050,127.0.0.1:8050
      MCP_ENABLE_PYTHON_TOOL: ${MCP_ENABLE_PYTHON_TOOL:-false}
      MCP_WEB_TIMEOUT_SECONDS: ${MCP_WEB_TIMEOUT_SECONDS:-15}
      MCP_WEB_MAX_BYTES: ${MCP_WEB_MAX_BYTES:-500000}
      MCP_WEB_ALLOW_DNS_FAKE_IPS: ${MCP_WEB_ALLOW_DNS_FAKE_IPS:-false}
    volumes:
      - agent_workspace:/workspace
    networks:
      - futureagent-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    restart: unless-stopped

  # ===== PostgreSQL 数据库 =====
  postgres:
    image: pgvector/pgvector:pg17
    container_name: futureagent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      # Windows 环境中 5432/5433 可能被本地 PostgreSQL 或系统端口保留占用；
      # 容器内仍使用 PostgreSQL 标准端口 5432，本机直连使用 25432。
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - futureagent-net
    restart: unless-stopped

  # ===== 用户端（React + Ant Design X） =====
  user-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: futureagent-user-frontend
    ports:
      # 当前 Windows 将 5173/5174 所在端口段保留，改用可访问的本地端口。
      # 如端口被其他项目占用，可在 .env 中设置 USER_FRONTEND_PORT。
      - "${USER_FRONTEND_PORT:-8081}:80"
    depends_on:
      - api
    networks:
      - futureagent-net
    restart: unless-stopped

  # ===== 管理员后台（React + Ant Design） =====
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      args:
        # 默认跳转统一网关；部署到不同域名时可显式设置完整公网地址。
        VITE_USER_FRONTEND_URL: ${USER_FRONTEND_PUBLIC_URL:-}
        VITE_USER_FRONTEND_PORT: ${GATEWAY_PORT:-80}
    container_name: futureagent-admin-frontend
    ports:
      - "${ADMIN_FRONTEND_PORT:-8082}:80"
    depends_on:
      - api
    networks:
      - futureagent-net
    restart: unless-stopped

  # ===== Nginx 反向代理 =====
  nginx:
    image: nginx:alpine
    container_name: futureagent-nginx
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - user-frontend
    networks:
      - futureagent-net
    restart: unless-stopped

volumes:
  postgres_data:
  agent_workspace:
  futureagent_uploads:
  futureagent_runtime_config:

networks:
  futureagent-net:
    driver: bridge
