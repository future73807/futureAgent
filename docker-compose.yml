services:
  # ===== futureAgent API 服务 =====
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: futureagent-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DSN: postgresql://postgres:password@postgres:5432/postgres
      DATABASE_URL: postgresql+psycopg://postgres:password@postgres:5432/postgres
      MCP_SERVERS_JSON: '{"local_tools":"http://mcp:8050/mcp"}'
      MCP_SERVER_PORT: 8050
      ENABLE_LOCAL_MCP_TOOLS: "false"
      LITELLM_PROXY_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-futureagent}
      ENVIRONMENT: production
      RUN_MIGRATIONS_ON_STARTUP: "true"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      STORAGE_S3_PREFIX: ${STORAGE_S3_PREFIX:-futureagent}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_started
      litellm:
        condition: service_started
    volumes:
      - futureagent_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - futureagent-net
    restart: unless-stopped

  # ===== 本地 MCP 工具服务 =====
  mcp:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: futureagent-mcp
    ports:
      - "8050:8050"
    environment:
      MCP_WORKSPACE_ROOT: /workspace
      MCP_SERVER_PORT: 8050
    volumes:
      - agent_workspace:/workspace
    networks:
      - futureagent-net
    restart: unless-stopped

  # ===== PostgreSQL 数据库 =====
  postgres:
    image: pgvector/pgvector:pg17
    container_name: futureagent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - futureagent-net
    restart: unless-stopped

  # ===== LiteLLM Proxy 与模型配置后台 =====
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: futureagent-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/postgres
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-futureagent}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-futureagent-salt-change-me}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - futureagent-net
    restart: unless-stopped


  # ===== 用户端（React + Ant Design X） =====
  user-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: futureagent-user-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - futureagent-net
    restart: unless-stopped

  # ===== 管理员后台（React + Ant Design） =====
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: futureagent-admin-frontend
    ports:
      - "5174:80"
    depends_on:
      - api
    networks:
      - futureagent-net
    restart: unless-stopped

  # ===== Nginx 反向代理 =====
  nginx:
    image: nginx:alpine
    container_name: futureagent-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - user-frontend
    networks:
      - futureagent-net
    restart: unless-stopped

volumes:
  postgres_data:
  agent_workspace:
  futureagent_uploads:

networks:
  futureagent-net:
    driver: bridge
