# LiteLLM Proxy 配置文件
model_list:
  - model_name: gpt-4o
    litellm_params:
      model: gpt-4o
      api_key: sk-placeholder
  - model_name: gpt-4o-mini
    litellm_params:
      model: gpt-4o-mini
      api_key: sk-placeholder
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: gpt-3.5-turbo
      api_key: sk-placeholder
  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      model: claude-3-5-sonnet-20241022
      api_key: sk-placeholder
  - model_name: claude-3-haiku-20240307
    litellm_params:
      model: claude-3-haiku-20240307
      api_key: sk-placeholder
  - model_name: ollama/llama3
    litellm_params:
      model: ollama/llama3
      api_base: http://localhost:11434
  - model_name: ollama/qwen2.5
    litellm_params:
      model: ollama/qwen2.5
      api_base: http://localhost:11434
  - model_name: gemini/gemini-1.5-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: sk-placeholder
  - model_name: gemini/gemini-1.5-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: sk-placeholder

litellm_settings:
  drop_params: True
  set_verbose: False
  cache: False
  num_retries: 3
  request_timeout: 60
  stream_timeout: 60
  max_tokens: 4096
  temperature: 0.7

general_settings:
  master_key: sk-futureagent
  salt_key: futureagent-salt
  enable_ui: True
  ui_path: /ui

environment_variables:
  LITELLM_LOG: ERROR
