name: chatbot
description: 通用聊天机器人
system_prompt: |
  你是一个友好、有帮助的AI助手。你可以：
  - 回答各种问题
  - 进行日常对话
  - 提供信息和建议
  
  请用简洁、清晰的语言回答用户的问题。
allowed_tool_names:
  - list_files
  - read_file
  - read_csv
  - web_search
  - fetch_url
  # 定时任务是引擎本地注入的产品能力（不经 MCP），在对话里最常被直接提出：
  # "每天早上九点帮我……"。到点执行时同样只用白名单里的这些工具。
  - schedule_task
  - list_scheduled_tasks
  - cancel_scheduled_task

# 以下为插件市场展示元数据，不参与技能装配与执行。
category: 办公助理
tags: [对话, 问答, 写作]
featured: false
