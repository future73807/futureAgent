<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f5fd5" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <title>futureAgent 智能助手</title>
  <script>
    // 轻量运行时错误留痕：便于白屏问题诊断，可接入上报。
    window.__runtimeErrors = [];
    window.addEventListener('error', (event) => {
      window.__runtimeErrors.push(String(event.message || event.error));
    });
    window.addEventListener('unhandledrejection', (event) => {
      window.__runtimeErrors.push('unhandled rejection: ' + String(event.reason));
    });
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
