version: "3.9"

services:
  # ===== futureAgent API 服务 =====
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: futureagent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_DSN=postgresql://postgres:password@postgres:5432/postgres
      - MCP_HOSTNAMES_CSV=mcp
      - MCP_SERVER_PORT=8050
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - futureagent-net
    restart: unless-stopped

  # ===== MCP Server (使用模板中的) =====
  mcp:
    build:
      context: ../temp_clone/backend/mcp
      dockerfile: Dockerfile
    container_name: futureagent-mcp
    ports:
      - "8050:8050"
    env_file:
      - .env
    networks:
      - futureagent-net
    restart: unless-stopped

  # ===== PostgreSQL 数据库 =====
  postgres:
    image: pgvector/pgvector:pg17
    container_name: futureagent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - futureagent-net
    restart: unless-stopped


  # ===== LiteLLM Dashboard 前端 (Next.js) =====
  frontend:
    build:
      context: ../temp_litellm/ui/litellm-dashboard
      dockerfile: Dockerfile
    container_name: futureagent-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - futureagent-net
    restart: unless-stopped

  # ===== Nginx 反向代理 =====
  nginx:
    image: nginx:alpine
    container_name: futureagent-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - futureagent-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  futureagent-net:
    driver: bridge
