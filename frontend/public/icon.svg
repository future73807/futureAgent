<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="futureAgent">
  <!-- 品牌标记：近黑圆角方块 + 白色终端提示符（>_）。
       刻意不用渐变、不用彩色——整套界面只有黑、白、灰三阶，
       彩色留给语义状态。粗笔画保证 16px favicon 下依然清晰。 -->
  <rect width="64" height="64" rx="16" fill="#1f1f22"/>
  <path d="M20 22 L31 32 L20 42" fill="none" stroke="#ffffff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="35" y="38" width="11" height="5.5" rx="2.75" fill="#ffffff"/>
</svg>
