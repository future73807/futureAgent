# 可选 LiteLLM 私有网关配置文件；默认 Compose 不会加载此文件。
model_list:
  - model_name: gpt-4o
    litellm_params:
      model: gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-4o-mini
    litellm_params:
      model: gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: gpt-3.5-turbo
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-3-haiku-20240307
    litellm_params:
      model: anthropic/claude-3-haiku-20240307
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: ollama/llama3
    litellm_params:
      model: ollama/llama3
      api_base: os.environ/OLLAMA_BASE_URL
  - model_name: ollama/qwen2.5
    litellm_params:
      model: ollama/qwen2.5
      api_base: os.environ/OLLAMA_BASE_URL
  - model_name: gemini/gemini-1.5-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GOOGLE_API_KEY
  - model_name: gemini/gemini-1.5-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GOOGLE_API_KEY
  - model_name: LongCat-2.0
    litellm_params:
      model: openai/LongCat-2.0
      api_key: ak_2FS6U37Dv2BG8sm6kv5Lk4TF7BW03
      api_base: https://api.longcat.chat/openai
      max_tokens: 128000

litellm_settings:
  drop_params: True
  set_verbose: False
  cache: False
  num_retries: 3
  request_timeout: 60
  stream_timeout: 60
  max_tokens: 4096
  temperature: 0.7

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  salt_key: os.environ/LITELLM_SALT_KEY
  # 运营入口统一在 futureAgent 管理后台；LiteLLM 仅保留为内部模型网关。
  enable_ui: False

environment_variables:
  LITELLM_LOG: ERROR
